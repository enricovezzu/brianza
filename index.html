<html lang="it">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Capy Derby">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1f2a26">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Capy Derby</title>
<script>try{var m=/[?&]sa=([\d.]+),([\d.]+),([\d.]+),([\d.]+)/.exec(location.search);if(m){var s=document.documentElement.style;['t','r','b','l'].forEach(function(k,i){s.setProperty('--sa-'+k,m[i+1]+'px')})}}catch(e){}</script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Gioco 3D a schermo intero: la scena riempie la pagina, l'interfaccia è un velo di vetro sopra.
   Look unico e dichiarato: giorno pieno in Brianza, luce calda, ambra per le azioni. */
:root{
  color-scheme: dark;
  --bg:#0d1c17;
  --glass:rgba(8,22,17,.78);
  --glass-line:rgba(255,255,255,.16);
  --ink:#f7f2e2;
  --muted:#c9dccf;
  --accent:#ffb02e;
  --accent-ink:#2a1700;
  --accent-shadow:#b36f00;
  --good:#8be28f;
  --bad:#ff7a6b;
  --me:#ffd400;
  --display:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--me);outline-offset:3px}
[hidden]{display:none!important}
#app{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#c3d5e3}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* etichette sopra i capybara */
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;padding:2px 10px 2px 8px;border-radius:999px;background:rgba(8,22,17,.62);color:#fff;font:800 12px/1.5 var(--body);white-space:nowrap;display:flex;align-items:center;gap:6px;will-change:transform;border:1px solid rgba(255,255,255,.18)}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tag.me{background:var(--me);color:var(--accent-ink);border-color:#fff}
.tag.me i{background:var(--accent-ink)}

/* effetti schermo */
.fx{position:absolute;inset:0;pointer-events:none}
.speed{opacity:0;background:radial-gradient(ellipse at 50% 51%,transparent 43%,rgba(12,19,19,.50) 83%,rgba(8,16,15,.86) 100%);transition:opacity .18s}

/* Effetti dei messaggi di gara */
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.ov{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:linear-gradient(180deg,rgba(6,18,14,.18),rgba(6,18,14,.5))}
.card{background:rgba(10,26,20,.86);border:1px solid var(--glass-line);border-radius:22px;padding:26px 28px;width:min(500px,100%);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;color:var(--accent);margin:0 0 6px}
.card h1,.card h2{font:400 clamp(30px,5vw,46px)/1.05 var(--display);margin:0 0 10px;text-wrap:balance}
.card p{margin:0 0 14px;color:#e3ece5;max-width:60ch}
.how{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:7px;color:var(--muted);font-size:15px}
.how b{color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:13px 30px;font:400 24px/1 var(--display);box-shadow:0 6px 0 var(--accent-shadow)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-shadow)}
.res{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px}
.res li{color:var(--ink);display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:7px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.res li.me{outline:3px solid var(--me);background:rgba(255,212,0,.14)}
.res i{width:13px;height:13px;border-radius:50%;display:inline-block;margin-right:9px;vertical-align:-1px}
.res .n{font:400 22px var(--display);color:var(--accent)}
.res .t{color:var(--muted)}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:700;color:var(--muted)}
.qrow span{margin-right:2px}
.qrow button{background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:999px;padding:3px 12px;font:800 12px var(--body);color:var(--muted)}
.qrow button:hover{color:var(--ink)}
.qrow button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{font-size:14px;color:var(--muted)!important;margin:0 0 16px!important}
#boot{position:absolute;inset:0;display:grid;place-items:center;background:#0d1c17;z-index:5;text-align:center;font:400 28px var(--display);color:var(--accent)}
#boot small{display:block;font:700 13px var(--body);color:var(--muted);margin-top:8px;letter-spacing:.1em;text-transform:uppercase}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#0d1c17;z-index:6}
/* menù, impostazioni, pausa */
.btn2{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--glass-line);border-radius:14px;padding:10px 18px;font:800 16px/1.2 var(--body);text-align:left}
.btn2:hover{background:rgba(255,255,255,.18)}
.btn2 small{display:block;font:700 12px/1.3 var(--body);color:var(--muted)}
.mlist{display:grid;gap:8px;margin:4px 0 14px}
.mlist .btn{text-align:left}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.field{display:grid;grid-template-columns:minmax(104px,36%) 1fr;gap:10px;align-items:center;margin:0 0 11px}
.field .lbl{font-weight:800;font-size:14px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:999px;padding:5px 13px;font:800 13px var(--body);color:var(--muted);min-height:34px;min-width:40px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg .swatch{width:34px;height:34px;min-width:34px;padding:0;border-radius:50%;background:var(--c);border:3px solid rgba(0,0,0,.35)}
.seg .swatch.on{background:var(--c);border-color:#fff;box-shadow:0 0 0 2px var(--accent-ink)}
input[type=range]{width:100%;height:30px;accent-color:var(--accent);margin:0}
input[type=text]{width:100%;font:800 16px var(--body);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:10px;padding:7px 12px;user-select:text;-webkit-user-select:text}
input:focus-visible{outline:3px solid var(--me);outline-offset:3px}
.wallet{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted)}
.wallet i,.yz i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f5b921 60%,#d98a00);display:inline-block}
/* Personalizza: accessori da sbloccare con gli yuzu, anteprima 3D dietro al pannello */
.seg button.locked{border-style:dashed;color:var(--muted)}
.seg .price{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-variant-numeric:tabular-nums}
.seg .lk{width:10px;height:12px;flex:none}
.seg .swatch{position:relative}
.seg .swatch.match::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(10,26,20,.75)}
.seg .swatch .lk{position:absolute;left:50%;top:50%;margin:-6px 0 0 -5px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.seg .swatch .pb{position:absolute;right:-9px;bottom:-7px;font:800 10px/1 var(--body);color:var(--ink);background:#0a1a14;border:1px solid var(--glass-line);border-radius:8px;padding:2px 4px}
.buy{background:rgba(255,176,46,.12);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin:4px 0 12px}
.buy p{margin:0!important;font-weight:700}
.buy .actions{margin-top:10px}
.buy .btn{font-size:18px;padding:10px 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#ovCustom{background:none}
#ovCustom .card{max-height:100%;overflow:auto}
#ovCustom .field{margin-bottom:9px}
@media (min-width:900px){#ovCustom{place-items:center start;padding-left:max(24px,4vw)}#ovCustom .card{width:min(480px,48vw)}}
@media (max-width:899px){#ovCustom{place-items:end center}#ovCustom .card{max-height:62%;padding:16px 18px}}
.credits{color:var(--muted);font-size:14px;display:grid;gap:8px;margin:0 0 6px;padding:0;list-style:none}
.credits b{color:var(--ink)}
#ovBreak .card{text-align:center;width:auto}
@media (min-width:900px){#ovMenu{place-items:center start;padding-left:max(24px,6vw)}#ovMenu .card{width:min(420px,100%)}}
@media (max-height:560px){.card{padding:16px 20px}.card h1,.card h2{font-size:28px}.mlist{grid-template-columns:1fr 1fr}.how{font-size:13px;gap:4px}}
.joinrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:9px 14px;margin:0 0 8px;font-weight:800}
.joinrow.wait{outline:2px dashed var(--me)}
.joinrow span{color:var(--muted);font-weight:700;font-size:14px}
.res li .who{font:800 11px var(--body);color:var(--accent-ink);background:var(--me);border-radius:6px;padding:1px 6px;margin-right:7px}
.pname{font-weight:800}
.hs-name::before,.joinrow b::before,.pname::before{content:'';display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--c);vertical-align:1px}
@media (max-width:700px){.card{padding:20px}}
/* ============================================================
   Layout adattivo + Liquid Glass (restyling stile iOS 26)
   Regole aggiunte DOPO quelle originali: le sostituiscono dove serve, senza riscriverle.
   Zone sicure in un punto solo (--sa-*); ?sa=alto,destra,basso,sinistra le simula nelle prove.
   Vetro: sfocatura vera SOLO sulle card dei menù/pausa/risultati (una per volta) e solo con qualità Media/Alta;
   in gara l'HUD è «vetro leggero» (gradiente, bordo e riflesso solo CSS, nessun backdrop-filter).
   ============================================================ */
:root{
  --sa-t:env(safe-area-inset-top,0px); --sa-r:env(safe-area-inset-right,0px);
  --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px);
  --edge:12px; --tap:44px;
  --r-card:30px; --r-ctl:18px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  /* vetro scuro (identità del gioco) */
  --lg-tint:rgba(10,26,20,.78); --lg-tint-solid:rgba(10,26,20,.90);
  --lg-filter:blur(22px) saturate(170%) brightness(.88);
  --lg-spec:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 24%,rgba(255,255,255,0) 42%);
  --lg-rim:inset 1px 1px 0 rgba(255,255,255,.30),inset -1px -1px 0 rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.08);
  --lg-rim-s:inset 1px 1px 0 rgba(255,255,255,.24),inset -1px -1px 0 rgba(0,0,0,.22),inset 0 0 0 1px var(--line);
  --lg-drop:0 18px 50px rgba(0,0,0,.34),0 3px 10px rgba(0,0,0,.18);
  --fill:rgba(255,255,255,.08); --fill-hi:rgba(255,255,255,.16); --line:rgba(255,255,255,.16);
  --body-ink:#e3ece5; --eyebrow:#ffcc66; --num:var(--accent); --ring-me:var(--me); --focus:var(--me);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{position:fixed;inset:0;height:auto;overscroll-behavior:none}
/* lo schermo di gioco segue la finestra visibile (barra di Safari che entra/esce) */
#app{position:fixed;inset:0;width:auto;height:auto;touch-action:manipulation}
@supports (height:100dvh){#app{bottom:auto;height:100dvh}}
#gl{touch-action:none}
button:focus-visible,input:focus-visible{outline-color:var(--focus)}
button{-webkit-touch-callout:none}

/* ---------- schermate: card che scorrono al loro interno, dentro le zone sicure ---------- */
.ov{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden;overscroll-behavior:contain;touch-action:manipulation;
  padding:calc(var(--sa-t) + var(--edge)) calc(var(--sa-r) + var(--edge)) calc(var(--sa-b) + var(--edge)) calc(var(--sa-l) + var(--edge))}
.card{max-height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(127,140,132,.55) transparent;touch-action:pan-y pinch-zoom;
  color:var(--ink);border:0;border-radius:var(--r-card);padding:clamp(18px,2.4vmin + 8px,28px);
  background:var(--lg-spec),var(--lg-tint-solid);box-shadow:var(--lg-rim),var(--lg-drop);-webkit-backdrop-filter:none;backdrop-filter:none}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root:not([data-q="0"]) .ov .card{background:var(--lg-spec),var(--lg-tint);-webkit-backdrop-filter:var(--lg-filter);backdrop-filter:var(--lg-filter)}
}
.card h1,.card h2{font-size:clamp(28px,5.4vmin,46px)}
.card p{color:var(--body-ink)}
.card > :last-child{margin-bottom:0}
.eyebrow{font-size:14px;letter-spacing:.12em;color:var(--eyebrow)}
.note,.wallet,.credits,.how{font-size:15px}
.wallet{font-size:14px}

/* pulsanti: gelatina con riflesso, pressione elastica */
.btn{border-radius:var(--r-ctl);min-height:52px;padding:12px 26px;
  background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,0) 55%),var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(120,60,0,.18),0 5px 0 var(--accent-shadow),0 10px 22px rgba(0,0,0,.24);
  transition:transform .5s var(--spring),box-shadow .2s var(--ease)}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 0 var(--accent-shadow),0 4px 12px rgba(0,0,0,.24);transition-duration:.09s}
.btn:disabled{opacity:.45;cursor:default}
.btn2{min-height:var(--tap);border:0;border-radius:var(--r-ctl);padding:10px 18px;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),var(--fill);box-shadow:var(--lg-rim-s);
  transition:transform .5s var(--spring),background-color .2s}
.btn2:hover{background-color:var(--fill-hi);background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 60%)}
.btn2:active{transform:scale(.97);transition-duration:.09s}
.btn2 small{font-size:14px;color:var(--muted)}
.actions{gap:12px}
.actions .btn2{min-height:52px}

/* campi e segmenti: binario di vetro con indicatore che scivola (vedi glideSeg nello script) */
.field{grid-template-columns:minmax(104px,34%) minmax(0,1fr);gap:12px}
.field .lbl{font-size:15px}
.seg{position:relative;isolation:isolate;justify-self:start;max-width:100%;gap:4px;padding:4px;border-radius:24px;background:var(--fill);box-shadow:inset 0 1px 2px rgba(0,0,0,.18),inset 0 0 0 1px var(--line)}
.seg button{position:relative;z-index:1;min-height:var(--tap);min-width:var(--tap);padding:6px 14px;border-radius:999px;border:1px solid transparent;background:transparent;
  font:800 15px var(--body);color:var(--muted);transition:transform .45s var(--spring),color .2s}
.seg button:active{transform:scale(.94);transition-duration:.08s}
.seg button.on{border-color:transparent;color:var(--accent-ink);background:linear-gradient(180deg,rgba(255,255,255,.40),rgba(255,255,255,0) 55%),var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 10px rgba(0,0,0,.22)}
.seg.glide button.on:not(.swatch){background:transparent;box-shadow:none}
.seg button.locked{border:1px dashed var(--line)}
.seg-ind{position:absolute;left:0;top:0;z-index:0;width:0;height:0;border-radius:999px;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 55%),var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(120,60,0,.2),0 4px 12px rgba(0,0,0,.24);
  transition:transform .46s var(--spring),width .32s var(--ease),height .32s var(--ease),opacity .2s}
.seg.glide .seg-ind{opacity:1}
.seg-ind.now{transition:none}
.seg .swatch{width:var(--tap);height:var(--tap);min-width:var(--tap);border:3px solid rgba(0,0,0,.35);background:var(--c)}
.seg .swatch.on{background:var(--c);border-color:#fff;box-shadow:0 0 0 2px var(--accent-ink),0 3px 10px rgba(0,0,0,.3)}
.seg .swatch .pb{font-size:14px;color:#f7f2e2;background:#0a1a14;right:-8px;bottom:-8px;padding:2px 5px}
input[type=range]{height:var(--tap)}
input[type=text]{min-height:var(--tap);border-radius:14px;background:var(--fill);border:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.2),inset 0 0 0 1px var(--line);color:var(--ink)}
.res li{background:var(--fill);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
.res li.me{outline-color:var(--ring-me)}
.res .n{color:var(--num)}
.joinrow{background:var(--fill);border-radius:16px}
.buy{border-radius:20px}

/* Durante il tuffo restano in vista tempo e posizione. */
#app.finishing :is(.run,.pad,.stam,#pauseBtn,.keys){visibility:hidden}

/* ---------- Telemetria di gara ---------- */
#app{
  --race-amber:#ffbf6b;
  --race-tint:rgba(17,27,23,.92);
  --race-glass:linear-gradient(180deg,rgba(255,245,218,.065),transparent),var(--race-tint);
  --race-line:rgba(242,233,211,.25);
  --race-gap:8px;
}
.hud{
  position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;gap:var(--race-gap);
  padding:calc(var(--sa-t) + 10px) calc(var(--sa-r) + 12px) calc(var(--sa-b) + 10px) calc(var(--sa-l) + 12px);
}
.glass,.chips,.round{
  background:var(--race-glass);border:1px solid var(--race-line);border-radius:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.22);
}
.row-top{
  display:grid;grid-template-columns:max-content minmax(0,1fr) max-content max-content;
  grid-template-areas:"pos prog speed chips";gap:var(--race-gap);align-items:stretch;
  font-variant-numeric:tabular-nums;
}
.right{display:contents}
.pos,.spd{padding:6px 10px;min-width:90px}
.pos{grid-area:pos;display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:baseline;column-gap:10px}
.pos small{grid-column:1/-1}
.spd{grid-area:speed;text-align:right}
.pos small,.spd small,.prog small,.stam .head{
  color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800;
}
.pos .big,.spd .big{white-space:nowrap;font:800 clamp(24px,4vmin,36px)/1 var(--body);letter-spacing:-.03em}
.pos .big{color:var(--race-amber)}
.pos .big span,.spd .big span,.pos .time{font:800 12px/1.2 var(--body);color:var(--muted);letter-spacing:0;white-space:nowrap}
.pos .big span,.spd .big span{margin-left:3px}
.spd .big #sSpeedVal{font:inherit;letter-spacing:inherit;color:inherit;margin:0}
.pos .big,.pos .time,.spd .big{font-variant-numeric:tabular-nums}
.prog{grid-area:prog;align-self:start;justify-self:center;width:min(460px,100%);min-width:0;padding:6px 10px}
.prog .head,.stam .head{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.prog small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog b{font-size:13px;white-space:nowrap}
.course{position:relative;height:16px;margin:2px 6px 0}
.course .rail,.bar{background:rgba(238,245,234,.2);overflow:hidden;border-radius:2px}
.course .rail{position:absolute;inset:6px 0;height:4px}
.course .rail i,.bar i{display:block;height:100%}
.course .rail i{width:0;background:var(--race-amber)}
.course .flag{
  position:absolute;right:-5px;top:2px;width:12px;height:12px;border:1px solid #eee8d8;border-radius:2px;
  background:repeating-conic-gradient(#eee8d8 0 25%,#28302b 0 50%) 0 0/6px 6px;
}
.dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:1px solid #111b17;transition:left .12s linear}
.dot.me{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border:2px solid #fff8e7;z-index:2}
.chips{grid-area:chips;display:flex;align-items:center;align-self:start;justify-self:end}
.yz{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font:800 12px var(--body);color:var(--ink)}
.chips .yz{padding-inline:8px}
.yz i{width:8px;height:8px;background:var(--race-amber)}
.mute{
  pointer-events:auto;display:grid;place-items:center;width:var(--tap);height:var(--tap);padding:0;
  color:var(--ink);background:transparent;border:0;border-inline-start:1px solid var(--race-line);touch-action:manipulation;
}
#mute{border-radius:0 9px 9px 0}
.mute svg{width:20px;height:20px}
.mute .lbl{display:none}
#mute[aria-pressed="true"]{color:var(--race-amber)}
.round:active,.mute:active{background:rgba(242,233,211,.19)}
@media (hover:hover){.mute:hover,.round:hover{color:var(--race-amber)}}
.row-bottom,.hs-bot{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:var(--race-gap);align-items:end}
.stam{grid-column:2;width:clamp(115px,30vw,360px);padding:6px 10px;font-variant-numeric:tabular-nums}
.stam .head{margin-bottom:4px}
.stam .head span:last-child{white-space:nowrap}
.bar{height:5px}
.bar i{width:100%;background:#a1d5a6}
.stam.tired{border-color:var(--bad)}
.stam.tired .bar i{background:var(--bad)}
.stam.tired .head span:first-child{color:#ff9e91}
.pad{pointer-events:auto;display:grid;grid-template-columns:repeat(2,max-content);gap:6px;justify-self:start}
.round,.run{min-width:var(--tap);min-height:var(--tap);touch-action:manipulation}
.round{width:clamp(44px,10vmin,56px);aspect-ratio:1;color:var(--ink);font-size:0;padding:0;display:grid;place-items:center}
.round::before{content:"";width:9px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:translateX(2px) rotate(135deg)}
.round:last-child::before{transform:translateX(-2px) rotate(-45deg)}
.run{
  grid-column:3;justify-self:end;pointer-events:auto;width:clamp(78px,18vmin,116px);height:clamp(52px,13vmin,70px);
  padding:0 5px;border:1px solid #ffd698;border-radius:10px;background:linear-gradient(180deg,#ffd18b,#f6ad52);
  color:#291905;font:800 clamp(15px,3vmin,20px)/1 var(--body);letter-spacing:.05em;
  box-shadow:0 3px 12px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;
}
.run:active,.run.down{background:#d78d38;border-color:#ffe0b1;box-shadow:none}
.keys{
  position:absolute;left:50%;bottom:calc(var(--sa-b) + 63px);transform:translateX(-50%);pointer-events:none;
  font:800 12px var(--body);color:var(--ink);text-shadow:0 1px 4px #111b17;white-space:nowrap;
}
.keys kbd{font:inherit;background:var(--race-tint);border:1px solid var(--race-line);border-radius:4px;padding:1px 6px}
.banner,.toast{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.banner{
  top:max(23%,calc(var(--sa-t) + 84px));padding:0 calc(var(--sa-r) + 12px) 0 calc(var(--sa-l) + 12px);
  font:800 clamp(42px,min(12vw,22vh),128px)/1 var(--body);color:#fff8e7;text-shadow:0 3px 14px rgba(0,0,0,.8);
}
.toast{top:calc(var(--sa-t) + 82px);padding:0 calc(var(--sa-r) + 12px) 0 calc(var(--sa-l) + 12px)}
.toast span{
  display:inline-block;max-width:100%;background:var(--race-tint);color:var(--race-amber);border:1px solid var(--race-line);
  padding:5px 12px;border-radius:8px;font:800 clamp(13px,2vw,17px) var(--body);box-shadow:0 3px 12px rgba(0,0,0,.24);
}
.toast.bad span{color:#ff9e91}
.tag{font-size:14px;border:1px solid rgba(255,255,255,.24);background:var(--race-tint)}
.tag.me{background:var(--race-amber);border-color:#ffe3ac}
@media (min-width:701px) and (pointer:fine){.pad.lanes{display:none}}
@media (max-width:700px),(pointer:coarse){.keys{display:none!important}}
@media (max-width:560px){
  .row-top{grid-template-columns:minmax(0,1fr) max-content;grid-template-areas:"pos speed" "prog chips"}
  .banner,.toast{top:calc(var(--sa-t) + 124px)}
  .field{grid-template-columns:minmax(0,1fr);gap:6px}
}
@media (orientation:portrait) and (max-width:560px){
  .row-bottom{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"stam stam stam" "pad . run"}
  .row-bottom .pad{grid-area:pad}
  .row-bottom .stam{grid-area:stam;justify-self:center;width:min(360px,100%)}
  .row-bottom .run{grid-area:run}
}
@media (max-height:560px){.how{font-size:14px}}

@media (max-height:440px){.card{padding:14px 18px}.card h1,.card h2{margin-bottom:4px}.card p{margin-bottom:8px}.eyebrow{margin-bottom:2px}.mlist{margin:2px 0 8px;gap:6px}.mlist .btn{min-height:46px;font-size:20px;padding:8px 20px}.btn2 small{line-height:1.2}}

/* ---------- Menu principale ---------- */
#ovMenu{background:linear-gradient(90deg,rgba(6,18,14,.36),rgba(6,18,14,.14) 52%,transparent 80%)}
#ovMenu .card{width:min(440px,100%);padding:clamp(16px,3.2vmin,28px)}
#mTitle{font-size:clamp(40px,8.8vmin,64px);letter-spacing:-.025em;margin:0 0 8px}
#ovMenu .card > p{max-width:38ch;margin-bottom:16px}
#ovMenu .mlist{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 14px}
#mSingle,#mMulti{grid-column:1/-1}
#mSingle{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(120,60,0,.24),0 5px 14px rgba(0,0,0,.24)}
#ovMenu .mlist .btn2{padding-inline:12px;overflow-wrap:anywhere}
#ovMenu .wallet{border-top:1px solid var(--line);padding-top:11px}
@media (max-width:639px) and (orientation:portrait){
  #ovMenu{place-items:end center;background:linear-gradient(180deg,transparent 18%,rgba(6,18,14,.26) 65%,rgba(6,18,14,.58))}
}
@media (min-width:640px) and (max-width:899px) and (orientation:landscape){
  #ovMenu{place-items:center start}
}
@media (min-width:640px) and (max-height:440px){
  #mTitle{font-size:36px}
  #ovMenu .card > p{max-width:none;margin-bottom:10px}
  #ovMenu .wallet{padding-top:8px}
  #mSingle,#mMulti{grid-column:auto}
}

/* ---------- Personalizza: pannello a lato su schermo largo E sul telefono in orizzontale ---------- */
#ovCustom .card{max-height:100%}
#ovCustom .field{grid-template-columns:minmax(88px,27%) minmax(0,1fr)}
@media (max-width:560px){#ovCustom .field{grid-template-columns:minmax(0,1fr)}}
@media (min-width:900px){#ovCustom{padding-left:calc(var(--sa-l) + max(24px,4vw))}#ovMenu{padding-left:calc(var(--sa-l) + max(24px,6vw))}}
@media (max-width:899px){#ovCustom .card{max-height:62%}}
@media (min-width:640px) and (max-width:899px) and (min-aspect-ratio:1/1){
  #ovCustom{place-items:center start;padding-left:calc(var(--sa-l) + 16px)}
  #ovCustom .card{width:min(440px,52vw);max-height:100%;padding:16px 18px}
}

/* ---------- Telemetria e comandi per ciascuna metà ---------- */
#hud.split .row-top{grid-template-columns:minmax(0,1fr) max-content;grid-template-areas:"prog chips"}
#hud.split :is(.pos,.spd,.yz,.row-bottom){display:none}
#hudS{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
#hudS .half{position:relative;overflow:hidden;--split-l:0px;--split-r:0px}
#hudS .half:first-child{--split-l:var(--sa-l)}
#hudS .half:nth-child(2){--split-r:var(--sa-r)}
#hudS .divider{position:absolute;inset:0 auto 0 50%;width:1px;background:rgba(255,255,255,.58);box-shadow:1px 0 3px #111b17}
.hs-top,.hs-bot{position:absolute;left:calc(var(--split-l) + 6px);right:calc(var(--split-r) + 6px)}
.hs-top{
  top:calc(var(--sa-t) + 64px);width:max-content;max-width:calc(100% - var(--split-l) - var(--split-r) - 12px);
  display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;padding:4px 7px;font:800 11px var(--body);font-variant-numeric:tabular-nums;
}
.hs-top .hs-pos{font-size:18px;color:var(--race-amber)}
.hs-top .hs-name{max-width:13ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs-top span{white-space:nowrap}
.hs-toast{top:calc(var(--sa-t) + 140px);padding:0 calc(var(--split-r) + 6px) 0 calc(var(--split-l) + 6px)}
.hs-bot{bottom:calc(var(--sa-b) + 10px);grid-template-columns:minmax(0,1fr)}
.hs-bot .stam{grid-column:1;justify-self:center;width:min(200px,100%);min-width:54px}
.hs-bot .pad,.hs-bot .run{display:none}
@media (pointer:coarse){
  .hs-bot{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"stam stam" "pad run";gap:5px}
  .hs-bot .stam{grid-area:stam}
  .hs-bot .pad{display:grid;grid-area:pad;gap:4px}
  .hs-bot .round{width:var(--tap)}
  .hs-bot .run{display:block;grid-area:run;width:clamp(50px,12vw,90px);height:var(--tap);font-size:13px;padding-inline:2px}
}
/* La larghezza utile di ogni metà esclude il ritaglio del display. */
#hudS .half{
  container-type:inline-size;
  padding-inline:calc(var(--split-l) + 6px) calc(var(--split-r) + 6px);
}
@container (max-width:165px){
  .hs-bot .run{width:var(--tap);font-size:11px;letter-spacing:0}
}
@media (pointer:coarse){
  @container (max-width:140px){
    .hs-bot{grid-template-areas:"stam stam" ". run" "pad pad"}
  }
}

/* Pausa e classifica riprendono le superfici e le cifre della telemetria. */
:is(#ovPause,#ovRes) .card{border-radius:14px;border:1px solid var(--line);box-shadow:var(--lg-drop)}
:is(#ovPause,#ovRes) h2{font-family:var(--body);font-weight:800}
:is(#ovPause,#ovRes) .eyebrow{font-size:11px;font-variant-numeric:tabular-nums}
:is(#ovPause,#ovRes) :is(.btn,.btn2){border-radius:8px;font:800 16px/1.2 var(--body)}
:is(#ovPause,#ovRes) .btn{background:var(--race-amber);box-shadow:none;transition:none}
:is(#ovPause,#ovRes) .btn:active{background:#da963f;transform:none}
#ovRes .res li{border-radius:8px;grid-template-columns:2ch minmax(0,1fr) fit-content(50%);font-size:14px;padding-inline:10px}
#ovRes .res li > :nth-child(2){overflow-wrap:anywhere}
#ovRes .res .t{text-align:right}
#ovRes .res .n{font:800 17px var(--body)}
#ovRes .res li.me{outline-width:1px}

/* ---------- tinta adattiva: vetro chiaro per le card quando il sistema è in modalità chiara (l'HUD resta scuro, sopra la scena) ---------- */
@media (prefers-color-scheme:light){
  .card{--lg-tint:rgba(250,246,236,.78);--lg-tint-solid:rgba(250,246,236,.95);--lg-filter:blur(22px) saturate(180%) brightness(1.06);
    --lg-spec:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 24%,rgba(255,255,255,0) 42%);
    --lg-rim:inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(0,0,0,.10),inset 0 0 0 1px rgba(30,50,40,.10);
    --lg-rim-s:inset 1px 1px 0 rgba(255,255,255,.8),inset -1px -1px 0 rgba(0,0,0,.08),inset 0 0 0 1px var(--line);
    --lg-drop:0 18px 50px rgba(0,0,0,.26),0 3px 10px rgba(0,0,0,.12);
    --ink:#17251c;--muted:#36463a;--body-ink:#24342a;--fill:rgba(20,45,32,.07);--fill-hi:rgba(20,45,32,.13);--line:rgba(20,45,32,.16);
    --eyebrow:#7a3d00;--num:#7a3d00;--ring-me:#b07800;--focus:#14402a;color-scheme:light}
  .card .res li.me{background:rgba(255,190,0,.22)}
}
/* trasparenza ridotta (impostazione di sistema) o vetro non supportato: superfici quasi opache */
@media (prefers-reduced-transparency:reduce){
  #app{--race-tint:#111b17}
  .card{--lg-tint:var(--lg-tint-solid)}
  .ov .card{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
@media (prefers-reduced-motion:reduce){
  .btn,.btn2,.seg button,.seg-ind,.dot{transition:none}
  .pop{animation:none}
}
</style>

<body>
<div id="app">
  <canvas id="gl" aria-label="Corsa 3D di cinque capybara in Brianza, da Seregno al lago di Pusiano" data-ta="canvas"></canvas>
  <div id="tags" aria-hidden="true"></div>
  <div class="fx speed" id="speedfx"></div>

  <div class="hud" id="hud" hidden>
    <div class="row-top">
      <div class="glass pos"><small data-t="hud.pos"></small><div class="big" id="sPos">1<span>/5</span></div><div class="time" id="sTime">0.0 s</div></div>
      <div class="glass prog" aria-hidden="true">
        <div class="head"><small data-t="hud.finish"></small><b id="sLeft">400 m</b></div>
        <div class="course" id="course"><div class="rail"><i id="railFill"></i></div><div class="flag"></div></div>
      </div>
      <div class="right">
        <div class="glass spd"><small data-t="hud.speed"></small><div class="big"><span id="sSpeedVal">0</span><span>km/h</span></div></div>
        <div class="chips">
          <span class="yz" id="yz" data-ta="hud.yuzu" role="img"><i></i><b id="sYuzu">0</b></span>
          <button class="mute" id="pauseBtn" type="button" data-ta="hud.pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12m6-12v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <button class="mute" id="mute" type="button" aria-pressed="false"></button>
        </div>
      </div>
    </div>
    <div></div>
    <div class="row-bottom">
      <div class="pad lanes">
        <button class="round" id="left" type="button" data-ta="hud.left">◀</button>
        <button class="round" id="right" type="button" data-ta="hud.right">▶</button>
      </div>
      <div class="glass stam" id="stam"><div class="head"><span id="stamLbl"></span><span id="stamPct">100%</span></div><div class="bar"><i id="stamFill"></i></div></div>
      <button class="run" id="run" type="button" data-t="hud.run"></button>
    </div>
  </div>
  <div id="hudS" hidden></div>
  <div class="keys" id="keys" hidden data-th="hud.keys"></div>

  <div class="banner" id="banner" hidden aria-live="assertive"></div>
  <div class="toast" id="toast" hidden aria-live="polite"><span id="toastTxt"></span></div>

  <div class="ov" id="ovMenu" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="card">
      <h1 id="mTitle">Capy Derby</h1>
      <p data-t="menu.intro"></p>
      <nav class="mlist" data-ta="menu.nav">
        <button class="btn" id="mSingle" type="button" data-t="menu.single"></button>
        <button class="btn2" id="mMulti" type="button"><span data-t="menu.multi"></span><small data-t="menu.multiSub"></small></button>
        <button class="btn2" id="mCustom" type="button" data-t="menu.custom"></button>
        <button class="btn2" id="mSettings" type="button" data-t="menu.settings"></button>
        <button class="btn2" id="mHow" type="button" data-t="menu.how"></button>
        <button class="btn2" id="mCredits" type="button" data-t="menu.credits"></button>
      </nav>
      <div class="wallet"><i></i><span id="mYuzu"></span></div>
    </div>
  </div>

  <div class="ov" id="ovSetup" hidden role="dialog" aria-modal="true" aria-labelledby="suT">
    <div class="card">
      <p class="eyebrow" data-t="menu.single"></p>
      <h2 id="suT" data-t="setup.title"></h2>
      <div class="field"><span class="lbl" id="lOpp" data-t="setup.opp"></span><div class="seg" id="segOpp" role="radiogroup" aria-labelledby="lOpp"></div></div>
      <div class="field"><span class="lbl" id="lDiff" data-t="setup.diff"></span><div class="seg" id="segDiff" role="radiogroup" aria-labelledby="lDiff"></div></div>
      <p class="note" data-t="setup.note"></p>
      <div class="actions"><button class="btn" id="suGo" type="button" data-t="setup.go"></button><button class="btn2" type="button" data-back data-t="back"></button></div>
    </div>
  </div>

  <div class="ov" id="ovMulti" hidden role="dialog" aria-modal="true" aria-labelledby="muT">
    <div class="card">
      <p class="eyebrow" data-t="multi.eyebrow"></p>
      <h2 id="muT" data-t="menu.multi"></h2>
      <div class="field"><span class="lbl" id="lMode" data-t="multi.mode"></span><div class="seg" id="segMode" role="radiogroup" aria-labelledby="lMode"></div></div>
      <p class="note" id="muWhy"></p>
      <div class="field"><span class="lbl" id="lMOpp" data-t="setup.opp"></span><div class="seg" id="segMOpp" role="radiogroup" aria-labelledby="lMOpp"></div></div>
      <div class="field"><span class="lbl" id="lMDiff" data-t="setup.diff"></span><div class="seg" id="segMDiff" role="radiogroup" aria-labelledby="lMDiff"></div></div>
      <div class="field"><span class="lbl" data-t="multi.p1"></span><span class="pname" id="muP1"></span></div>
      <div class="field"><label class="lbl" for="muName2" data-t="multi.p2"></label><input type="text" id="muName2" maxlength="12" autocomplete="off" spellcheck="false"></div>
      <div class="field"><span class="lbl" id="lBib2" data-t="multi.bib2"></span><div class="seg" id="segBib2" role="radiogroup" aria-labelledby="lBib2"></div></div>
      <div class="actions"><button class="btn" id="muGo" type="button" data-t="multi.next"></button><button class="btn2" type="button" data-back data-t="back"></button></div>
    </div>
  </div>

  <div class="ov" id="ovJoin" hidden role="dialog" aria-modal="true" aria-labelledby="joT">
    <div class="card">
      <p class="eyebrow" data-t="multi.split"></p>
      <h2 id="joT" data-t="join.title"></h2>
      <p id="joAsk" aria-live="polite"></p>
      <div class="joinrow" id="joR0"><b id="joN0"></b><span id="joD0"></span></div>
      <div class="joinrow" id="joR1"><b id="joN1"></b><span id="joD1"></span></div>
      <p class="note" data-t="join.note"></p>
      <div class="actions"><button class="btn" id="joGo" type="button" data-t="setup.go" disabled></button><button class="btn2" type="button" data-back="ovMulti" data-t="back"></button></div>
    </div>
  </div>

  <div class="ov" id="ovPass" hidden role="dialog" aria-modal="true" aria-labelledby="psT">
    <div class="card">
      <p class="eyebrow" data-t="multi.turns"></p>
      <h2 id="psT"></h2>
      <p id="psTxt"></p>
      <p class="note" id="psNote"></p>
      <div class="actions"><button class="btn" id="psGo" type="button" data-t="setup.go"></button><button class="btn2" id="psMenu" type="button" data-t="pause.menu"></button></div>
    </div>
  </div>

  <div class="ov" id="ovCustom" hidden role="dialog" aria-modal="true" aria-labelledby="cuT">
    <div class="card">
      <p class="eyebrow" data-t="custom.eyebrow"></p>
      <h2 id="cuT" data-t="menu.custom"></h2>
      <div class="field"><label class="lbl" for="cuName" data-t="custom.name"></label><input type="text" id="cuName" maxlength="12" autocomplete="off" spellcheck="false"></div>
      <div class="field"><span class="lbl" id="lBib" data-t="custom.bib"></span><div class="seg" id="segBib" role="radiogroup" aria-labelledby="lBib"></div></div>
      <div class="field"><span class="lbl" id="lCuWho" data-t="acc.who"></span><div class="seg" id="segCuWho" role="radiogroup" aria-labelledby="lCuWho"></div></div>
      <div class="field"><span class="lbl" id="lAcc_hat" data-t="acc.hat"></span><div class="seg" id="segAcc_hat" role="radiogroup" aria-labelledby="lAcc_hat"></div></div>
      <div class="field"><span class="lbl" id="lAcc_glasses" data-t="acc.glasses"></span><div class="seg" id="segAcc_glasses" role="radiogroup" aria-labelledby="lAcc_glasses"></div></div>
      <div class="field"><span class="lbl" id="lAcc_neck" data-t="acc.neck"></span><div class="seg" id="segAcc_neck" role="radiogroup" aria-labelledby="lAcc_neck"></div></div>
      <div class="field"><span class="lbl" id="lAcc_col" data-t="acc.col"></span><div class="seg" id="segAcc_col" role="radiogroup" aria-labelledby="lAcc_col"></div></div>
      <div class="buy" id="cuBuy" hidden role="group" aria-labelledby="cuBuyTxt"><p id="cuBuyTxt"></p><div class="actions"><button class="btn" id="cuBuyGo" type="button"></button><button class="btn2" id="cuBuyNo" type="button"></button></div></div>

/* ============================================================================

     Portal.init()                      -> all'avvio; sceglie il portale da ?portal=poki|crazygames|mock (default: nessuno)
     Portal.loadingFinished()           -> quando il gioco è pronto (schermata del titolo visibile)
     Portal.gameplayStart()             -> quando il giocatore inizia (clic su "Via!" / "Rivincita")
     Portal.gameplayStop()              -> a fine corsa, in pausa, uscendo al menu
     Portal.breakBetweenRaces(hooks)    -> intervallo pubblicitario tra due corse; promessa. hooks = { mute(), unmute() }
     Portal.rewarded(hooks)             -> annuncio con premio (promessa true/false); NON usato ora
     Portal.onMuteChange(fn)            -> il portale può chiedere di silenziare (CrazyGames settings.muteAudio)
     Portal.openLink(url)               -> apre un link esterno nel modo ammesso dal portale

     - Poki: gameplayStop -> commercialBreak -> gameplayStart; niente link esterni se non via PokiSDK.openExternalLink;
       niente richieste esterne oltre allo SDK; audio da silenziare durante gli annunci; localStorage in try/catch.
     - CrazyGames: SDK v3 con await init(); ambiente 'disabled' fuori dai domini ammessi (non chiamare l'SDK);
       requestAd('midgame', callbacks) con adStarted/adFinished/adError; settings.muteAudio ha la priorità.

  const P = { kind: 'none', sdk: null, ok: false, muteListeners: [], log: [] };
  const params = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');
  const say = (...a) => { P.log.push(a.join(' ')); if (P.kind === 'mock' || params.has('portaldebug')) console.log('[Portal]', ...a); };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('script non caricato: ' + src)); document.head.appendChild(s); });
  }

  async function init() {
    const want = (params.get('portal') || (window.__PORTAL__ || '')).toLowerCase();
    try {
      if (want === 'poki') {
        if (!window.PokiSDK) await loadScript('https://game-cdn.poki.com/scripts/v2/poki-sdk.js');
        P.kind = 'poki'; P.sdk = window.PokiSDK;
        await P.sdk.init().then(() => say('Poki pronto')).catch(() => say('Poki: init con errore, si prosegue'));
        P.ok = true;
      } else if (want === 'crazygames') {
        if (!window.CrazyGames) await loadScript('https://sdk.crazygames.com/crazygames-sdk-v3.js');
        const SDK = window.CrazyGames && window.CrazyGames.SDK;
        if (SDK) {
          await SDK.init();
          if (SDK.environment === 'disabled') { say('CrazyGames: ambiente disabled, SDK non usato'); }
          else {
            P.kind = 'crazygames'; P.sdk = SDK; P.ok = true;

          }

    if (playing) return; playing = true; say('gameplayStart');

  }

  async function breakBetweenRaces(h) {
    h = h || {}; const mute = h.mute || (() => {}), unmute = h.unmute || (() => {});
    say('breakBetweenRaces');
    try {
      if (P.kind === 'poki') {
        await P.sdk.commercialBreak(() => { mute(); });
        unmute();
      } else if (P.kind === 'crazygames') {
        await new Promise(res => {
          let done = false; const end = () => { if (!done) { done = true; unmute(); res(); } };
          P.sdk.ad.requestAd('midgame', { adStarted: () => mute(), adFinished: end, adError: end });
          setTimeout(end, 90000);   // rete di sicurezza: non restare mai bloccati
        });
      } else if (P.kind === 'mock') {
        mute(); await wait(1500); unmute();
      }
    } catch (e) { say('break non riuscito:', e.message); unmute(); }
  }
  // annuncio con premio: true solo se il video è stato davvero mostrato (non usato dal gioco per ora)
  async function rewarded(h) {
    h = h || {}; const mute = h.mute || (() => {}), unmute = h.unmute || (() => {});
    try {
      if (P.kind === 'poki') { const ok = await P.sdk.rewardedBreak(() => { mute(); }); unmute(); return !!ok; }
      if (P.kind === 'crazygames') {
        return await new Promise(res => P.sdk.ad.requestAd('rewarded', { adStarted: () => mute(), adFinished: () => { unmute(); res(true); }, adError: () => { unmute(); res(false); } }));
      }
      if (P.kind === 'mock') { mute(); await wait(1500); unmute(); return true; }
    } catch (e) { say('rewarded non riuscito:', e.message); unmute(); }

  }
  function openLink(url) {
    if (P.kind === 'poki') return call(() => P.sdk.openExternalLink(url));
    if (P.kind === 'none') return window.open(url, '_blank', 'noopener');

  }

/* ============================================================================

   Si incolla dentro lo script del gioco; funziona anche in Node (module.exports).

   - s  = distanza in metri lungo la LINEA CENTRALE della pista. Partenza s=0, traguardo s=TRACK_LEN (400).
          È valido anche fuori da 0..400: prima della partenza e dopo il traguardo la pista prosegue dritta
          (da -PATH_BEFORE a TRACK_LEN+PATH_AFTER).

    - (1 / 95) * bump(s, 235, 260, 290, 320)    // verso Montevecchia: lunga curva a destra in salita
    + (1 / 70) * bump(s, 325, 345, 370, 395);   // discesa verso il lago: curva a sinistra

function skyMaterial(env) {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    defines: { SKY_OCT: QL.detail ? 5 : 3 },
    uniforms: { sun: { value: SUN }, uTime, hor: { value: C(HORIZON) }, uDisc: { value: env ? 0 : 1 } },
    vertexShader: 'varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform vec3 sun,hor; uniform float uTime,uDisc; varying vec3 vD;
      float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y); }

        c+=vec3(1.0,0.93,0.8)*smoothstep(0.99965,0.99985,mu)*38.0*uDisc;

function roadSignPose(s, lat) {
  const p = PATH.point(s, lat, 0, {}), approach = PATH.point(s - 19, 0, 0, {});

function roadText(g, text, x, y, size, width, color) {

function roadWarning(kind, meters, title) {
  const white = C(0xffffff), gray = C(0xa4a9a6), width = 1.12, bottom = 1.34;
  const XY = ([x,y]) => [(x-128)*width/256, bottom+(320-y)*width/256];

  shape.closePath();
  const blank = geo => {
    const u = geo.attributes.uv;

    return [geo,gray];
  };
  const face = new THREE.ShapeGeometry(shape).translate(0,0,.024), uv = face.attributes.uv, pos = face.attributes.position;
  for (let i=0;i<uv.count;i++) uv.setXY(i,pos.getX(i)/width+.5,(pos.getY(i)-bottom)/(width*1.25));
  const plaque = new THREE.PlaneGeometry(width*216/256,width*76/256).translate(0,XY([128,275])[1],.024);
  const puv = plaque.attributes.uv;
  for (let i=0;i<puv.count;i++) puv.setXY(i,(20+puv.getX(i)*216)/256,(7+puv.getY(i)*76)/320);
  const parts = [
    blank(new THREE.CylinderGeometry(.036,.036,2.59,7).translate(0,1.22,-.044)),

  ];
  const paint = () => canvasTex(256,320,(g,w,h) => {
    g.fillStyle = '#e9e8df'; g.fillRect(0,0,w,h);
    g.fillStyle = '#ae2724'; g.fillRect(0,0,w,221);
    g.fillStyle = '#f3f0e8'; g.beginPath(); g.moveTo(128,52); g.lineTo(42,199); g.lineTo(214,199); g.closePath(); g.fill();
    g.fillStyle = '#1d2423'; g.strokeStyle = '#1d2423'; g.lineCap = 'round'; g.lineJoin = 'round';
    if (kind === 'ford') {
      g.lineWidth = 8;
      for (const base of [133,153,173]) {

        g.bezierCurveTo(94,base-12,103,base+11,115,base);
        g.bezierCurveTo(130,base-12,142,base+11,154,base);
        g.bezierCurveTo(163,base-7,171,base-6,176,base);g.stroke();
      }
    } else if (kind === 'duck') {
      g.beginPath(); g.moveTo(77,148); g.quadraticCurveTo(99,154,116,145);g.quadraticCurveTo(127,140,127,126);
      g.bezierCurveTo(126,112,145,105,153,118);g.lineTo(171,123);g.lineTo(170,130);
      g.lineTo(153,133);g.bezierCurveTo(153,172,140,182,115,181);g.bezierCurveTo(94,180,83,168,77,148);g.fill();
    } else {
      for (const [x,y,r] of [[101,151,15],[118,142,18],[137,143,17],[149,152,13],[113,159,14],[132,159,15]]) {
        g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
      }
      g.beginPath();g.ellipse(164,150,13,10,-.37,0,TAU);g.fill();
      for (const x of [108,136]) g.fillRect(x,162,6,22);
      g.beginPath();g.ellipse(157,138,4,8,-.48,0,TAU);g.fill();
    }
    g.fillStyle='#f0eee5';g.fillRect(20,237,216,76);
    g.strokeStyle='#262c2a';g.lineWidth=4;g.strokeRect(23,240,210,70);
    if (title) {

    } else {

}

function buildSigns() {
  const marks = [[47,-8.3,'SEREGNO'],[182,-8.4,'LESMO'],[255,-8.4,'MONTEVECCHIA']];
  const boards = marks.map(([s,lat,name]) => ({s,lat,text:()=>name,kind:'place',width:1.95,height:.65}));
  boards.push({s:337,lat:-8.5,text:()=>t('w.lake'),kind:'lake',width:2.26,height:.68});
  for (const meters of [100,50]) {
    boards.push({s:TRACK-meters,lat:8.0,text:()=>t('w.finish'),kind:'race',width:1.25,height:.73,meters});
  }
  const metal = new MB(), steel = C(0x9ca3a1);
  for (const sign of boards) {
    const {x,y,z,yaw} = roadSignPose(sign.s,sign.lat);
    const {width,height} = sign, base = sign.kind==='race' ? 1.04 : 1.58, hPx = Math.round(512*height/width);
    const text = () => canvasTex(512,hPx,(g,w,h) => {
      const place = sign.kind==='place', race = sign.kind==='race', ink = place ? '#171d1c' : '#f5f1e5';
      g.fillStyle = place ? '#efeee6' : race ? '#193e33' : '#68452d'; g.fillRect(0,0,w,h);
      g.strokeStyle = race ? '#c7a373' : ink; g.lineWidth=4; g.strokeRect(8,8,w-16,h-16);
      if (race) {
        roadText(g,sign.text(),w/2,h*.32,53,w-64,ink);
        roadText(g,`${sign.meters} m`,w/2,h*.69,113,w-74,ink);
      } else {
        roadText(g,sign.text(),place?w/2:w*.43,h*.515,place ? 91 : 65,place ? w-54 : w-122,ink);
        if (!place) {
          const a = w-58, b = h*.27, size = h*.41;
          g.beginPath();g.moveTo(a,b);g.lineTo(a-size*.46,b+size*.50);g.lineTo(a-size*.16,b+size*.50);
          g.lineTo(a-size*.16,b+size);g.lineTo(a+size*.16,b+size);g.lineTo(a+size*.16,b+size*.50);
          g.lineTo(a+size*.46,b+size*.50);g.closePath();g.fill();
        }
      }
      if (place) {
        g.fillStyle='#7f857f';
        for (const u of [22,w-22]) { g.beginPath();g.arc(u,h/2,3,0,TAU);g.fill(); }
      }
    });
    metal.push(x,y,z,yaw);
    for (const off of (sign.kind==='place' ? [-.62,.62] : [0])) {
      metal.cyl(off,-.09,-.055,.033,.033,base+height*.78,7,1,steel);
      if (QL.detail) metal.box(off,base+height*.44,-.048,.087,.084,.074,1,steel);
    }
    metal.box(0,base,-.014,width,height,.05,1,steel,'blrtd');
    metal.pop();
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width,height),std(0xffffff,.61,{map:text(),envMapIntensity:.24}));
    mesh.rotation.y = yaw;
    mesh.position.set(x + Math.sin(yaw)*.018,y + base + height/2,z + Math.cos(yaw)*.018); scene.add(mesh);
    if (sign.kind!=='place') langHooks.push(() => { const prev=mesh.material.map; mesh.material.map=text(); prev.dispose(); });
  }
  const stand = metal.mesh(std(0xffffff,.59,{metalness:.28,vertexColors:true}),true);
  stand.name = 'Supporti segnaletica';
  // Distanza dall'acqua sulla linea centrale, misurata dalla rampa del guado.
  const warningS = 87;
  let dry=PATH.ford.s0, wet=dry+PATH.ford.ramp;
  for (let i=0;i<14;i++) {
    const s = (dry+wet)/2;
    if (PATH.waterDepth(s)>.05) wet=s;
    else dry=s;
  }
  const warning = roadWarning('ford',Math.round(wet-warningS),()=>t('w.ford'));
  const hazard = new THREE.Mesh(warning.geo,warning.material);
  const pose = roadSignPose(warningS,8.1);
  hazard.position.set(pose.x,pose.y,pose.z); hazard.rotation.y = pose.yaw; scene.add(hazard);
}

        const p = PATH.point(s, l, 0, {}), y = ground(p.x, p.z);
        if (y < PATH.waterY - .20 || PATH.nearest(p.x, p.z).dist < 10.4) continue;
        const close = Math.abs(l) < 28, h = .55 + (1 - towardWater) * (close ? .82 : 1.42) + edge() * .32;
        if (close && edge() < .61) {
          tuftAt(blades, p, y - .065, .34 + edge() * .55, h, rush);
        } else {
          tuftAt(reeds, p, y - .075, .48 + edge() * .67, h, rush);
        }
      }
    }
  }

  // Distinct stretches of reed bed at Pusiano, with the beach and pontile clear.
  for (let i = 0; i < 3250 * QL.veg; i++) {
    const x = -330 + edge() * 700, cover = fbm(x / 19 + 5, 3, 2);
    if (Math.abs(x - 9) < 23 || cover < .47) continue;
    const depth = -4.5 + edge() * 10, z = shoreZ(x, depth);
    const y = Math.max(ground(x, z), WATER_Y - .48);
    const h = 1.15 + edge() * .88 + cover * .54 - Math.max(0, depth) * .09;
    tuftAt(reeds, { x, z }, y - .08, .88 + edge() * .75, h, rush);
  }

  cardMesh(T.grassTuft, tuft, { base: true, sway: true, amp: .075, shadow: false, alpha: .41, trans: .13, round: 0 });
  cardMesh(T.flowers, flowers, { base: true, sway: true, amp: .065, shadow: false, alpha: .42, trans: .1, round: 0 });
  cardMesh(T.reeds, reeds, { base: true, sway: true, amp: .16, shadow: false, alpha: .42, trans: .17, round: 0,
    zone: p => p.z > -310 ? 0 : p.x < -25 ? 1 : p.x > 42 ? 3 : 2 });
  const bladeGeo = vergeBlades(), bladeWind = .105;
  vegetationBatches(bladeGeo, foliageMat(null, { sway: true, amp: bladeWind, trans: .13, round: 0 }), blades, (i, d) => {
    const b = blades[i];
    d.position.set(b.x, b.y, b.z); d.rotation.y = b.ry; d.scale.set(b.sx, b.sy, b.sx);
    return b.c;
  }, false, 145, 95, bladeWind);
  world.tris += blades.length * bladeGeo.index.count / 3;
}
// z della riva a una certa x, spostata di 'inside' metri verso il lago (negativo = entroterra)
function shoreZ(x, inside) { let a = -330, b = -720; for (let i = 0; i < 22; i++) { const m = (a + b) / 2; if (lakeIn(x, m) < inside) a = m; else b = m; } return (a + b) / 2; }

/* ---- pulviscolo e pollini nel controluce ---- */
function buildPollen() {
  const n = 110, pos = new Float32Array(n * 3);
  world.ffN = n; world.ffSeed = [];
  for (let i = 0; i < n; i++) world.ffSeed.push({ x: rnd(-16, 16), y: rnd(.4, 5), z: rnd(-30, 30), p: rnd(0, TAU), s: rnd(.4, 1.2) });
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: .07, map: T.soft, color: C(0xfff4d0), transparent: true, depthWrite: false, opacity: .35 }));
  pts.frustumCulled = false; scene.add(pts); world.ff = pts;
}

/* ---- pubblico: solo animali. Fauna della Brianza e dei laghi, modelli procedurali istanziati
        (corpo, testa mobile, ali) con testa che segue la gara, saltelli e battiti d'ali ---- */
// Sezioni ellittiche lungo una linea di centri. Gli estremi a raggio zero
// condividono un solo vertice per polo. La cucitura UV conserva la stessa normale.
function animalProfile(mesh, rings, sides, paint, textureShape) {
  const points = rings.map(([x, y, z]) => new THREE.Vector3(x, y, z));
  const frames = points.map((point, i) => {
    const axis = points[Math.min(i + 1, points.length - 1)].clone()
      .sub(points[Math.max(i - 1, 0)]).normalize();
    const width = new THREE.Vector3(1, 0, 0).addScaledVector(axis, -axis.x).normalize();
    return [axis, width, new THREE.Vector3().crossVectors(axis, width)];
  });
  const surface = rings.map(([, , , rx, ry], i) => {
    const [, width, depth] = frames[i];
    return Array.from({ length: sides }, (_, j) => {
      const angle = j * TAU / sides;
      const scale = textureShape ? textureShape(i, angle) : 1;
      return points[i].clone().addScaledVector(width, Math.cos(angle) * rx * scale)
        .addScaledVector(depth, Math.sin(angle) * ry * scale);
    });
  });
  const indices = rings.map(([, , , rx], i) => {
    const [axis] = frames[i];
    const ring = surface[i], prev = surface[Math.max(i - 1, 0)], next = surface[Math.min(i + 1, rings.length - 1)];
    const add = (j, n) => {
      const p = ring[j % sides];
      const color = paint(i, j * TAU / sides, p);
      return mesh.vert(p.x, p.y, p.z, n.x, n.y, n.z, j / sides, i / (rings.length - 1), color);
    };
    if (!rx) return Array(sides + 1).fill(add(0, axis.clone().multiplyScalar(i ? 1 : -1)));
    return Array.from({ length: sides + 1 }, (_, j) => {
      const across = ring[(j + 1) % sides].clone().sub(ring[(j + sides - 1) % sides]);
      const along = next[j % sides].clone().sub(prev[j % sides]);
      return add(j, across.cross(along).normalize());
    });
  });
  for (let i = 1; i < rings.length; i++) for (let j = 0; j < sides; j++) {
    const a = indices[i - 1][j], b = indices[i - 1][j + 1];
    const c = indices[i][j], d = indices[i][j + 1];
    if (a !== b) mesh.i.push(a, b, c);
    if (c !== d) mesh.i.push(b, d, c);
  }
}

function animalEye(mesh, x, y, z, r, iris, sx, hi, frontal = false) {
  mesh.ell(x, y, z, r * (frontal ? 1 : .6), r, r * (frontal ? .58 : .83), iris, { ws: 6, hs: 3 });
  if (iris !== BLACK) {
    mesh.ell(x + (frontal ? 0 : sx * r * .43), y, z - r * (frontal ? .47 : .22),
      r * (frontal ? .43 : .29), r * .57, r * .35, BLACK, { ws: 5, hs: 3 });
  }
  if (hi) mesh.ell(x + sx * r * (frontal ? -.24 : .48), y + r * .36, z - r * (frontal ? .53 : .56),
    r * .22, r * .22, r * .22, WHITE, { ws: 5, hs: 3 });
}

function birdModel(o) {
  const b = new MB(), h = new MB(), w = o.flap ? new MB() : null;
  const { by, bw, bh, bl, hr, kind } = o, tilt = o.tilt || 0;
  const sides = o.hi ? 12 : QL.detail ? 8 : 6;
  const mallard = kind === 'anatra', owl = kind === 'civetta', magpie = kind === 'gazza';
  const webbed = mallard || kind === 'oca' || kind === 'cigno';
  const tail = o.tail || o.back, tl = bl * (o.tailLen || .35);
  const slope = (y, z) => by + y * bh - Math.sin(tilt) * z;
  const trunk = [[-1, .12, 0, 0], [-.74, .03, .72, .8], [-.26, 0, 1, 1],
    [.27, .05, .91, .89], [.73, .17, .59, .56], [1, .29, .32, .27]];
  const feathers = magpie ? C(0x233a50) : tail;
  animalProfile(b, [
    ...trunk.map(([z, y, x, r]) => [0, slope(y, z * bl), z * bl, x * bw, r * bh]),
    [0, slope(.35, bl) - Math.sin(o.tailTilt || 0) * tl * .6, bl + tl * .48, bw * (magpie ? .43 : .37), bh * .12],
    [0, slope(.36, bl) - Math.sin(o.tailTilt || 0) * tl, bl + tl, 0, 0]
  ], sides, (i, a) => i >= trunk.length - 1 ? feathers :
    Math.sin(a) < -.28 ? o.belly : i < 3 && o.chest ? o.chest : o.back);

  if (o.legs) for (const sx of [-1, 1]) {
    const r = o.legR, x = sx * bw * .46, ankle = o.by > .5 ? r * 1.5 : r;
    animalProfile(b, [[x, by - bh * .52, .02, r * 1.25, r * 1.18],
      [x, by * .52, .02 + (o.by > .5 ? r * 2 : 0), r * .79, r * .79],
      [x, ankle, .015, r * .85, r * .8]], QL.detail ? 6 : 4, () => o.legC);
    // La pianta si apre in avanti per gli uccelli acquatici; gli altri hanno dita libere.
    if (webbed) {
      animalProfile(b, [[x, r * .55, .036, 0, 0], [x, r * .67, .012, r * 1.12, r * .53],
        [x, r * .46, -r * 2.2, r * 2.14, r * .40], [x, r * .42, -r * 3.55, r * 1.65, r * .31],
        [x, r * .37, -r * 3.9, 0, 0]], QL.detail ? 6 : 5, () => o.legC);
    } else {
      for (const toe of [-1, 0, 1]) {
        const reach = (toe ? 2.6 : 3.6) * r;
        animalProfile(b, [[x, ankle, .015, r * .62, r * .52],
          [x + toe * r * .72, r * .55, .012 - reach * .5, r * .42, r * .40],
          [x + toe * r * 1.6, r * .26, .012 - reach, 0, 0]], 4, () => o.legC);
      }
    }
  }

  const wing = (mesh, sx) => {
    const base = o.wingC || o.back;
    const tip = !mallard && o.wingTip ? o.wingTip : base;
    const edging = mallard ? C(0xe6e0cd) : base;
    animalProfile(mesh, [
      [sx * bw * .66, slope(.39, -bl * .61), -bl * .61, 0, 0],
      [sx * bw * .79, slope(.28, -bl * .44), -bl * .44, bw * .28, bh * .54],
      [sx * bw * .91, slope(.13, -bl * .05), -bl * .05, bw * .23, bh * .68],
      [sx * bw * .83, slope(.07, bl * .39), bl * .39, bw * .22, bh * .54],
      [sx * bw * .70, slope(.03, bl * .81), bl * .81, bw * .16, bh * .29],
      [sx * bw * .52, slope(.09, bl * 1.04), bl * 1.04, 0, 0]
    ], QL.detail ? 8 : 5, (i, a) => {
      if (mallard && i >= 2 && i <= 4 && Math.cos(a) * sx > .3) {
        if (i === 3) return o.wingTip;
        if (i === 4) return edging;
      }
      return i >= 4 ? tip : base;
    });
  };
  if (w) wing(w, 1);
  else for (const sx of [-1, 1]) wing(b, sx);

  const pv = [0, slope(.21, -bl * .53), -bl * .53];
  const neck = [[...pv, o.neck[0][2] * 1.24, o.neck[0][2] * 1.15]];
  const colors = [o.chest || o.neckC || o.neck[0][4]];
  // Il primo anello entra nel petto e accompagna la rotazione della testa.
  let y = slope(.4, -bl * .7), z = -bl * .7;
  for (const [dy, dz, , radius, color] of o.neck) {
    y += dy; z += dz;
    neck.push([0, y, z, radius, radius * 1.03]);
    colors.push(color || o.neckC);
  }
  const hc = [0, y + hr * .25, z - hr * .25];
  neck.push([0, hc[1], hc[2], hr * .53, hr * .58]);
  colors.push(o.headC);
  const curve = new THREE.CatmullRomCurve3(neck.map(p => new THREE.Vector3(...p.slice(0, 3))));
  const neckSteps = QL.detail ? 2 : 1, neckCount = (neck.length - 1) * neckSteps;
  const smoothNeck = Array.from({ length: neckCount + 1 }, (_, i) => {
    const t = i / neckSteps, j = Math.min(Math.floor(t), neck.length - 2);
    const p = curve.getPoint(i / neckCount);
    const radius = THREE.MathUtils.lerp(neck[j][3], neck[j + 1][3], t - j);
    return [p.x, p.y, p.z, radius, radius * 1.06];
  });
  const neckPaint = smoothNeck.map((_, i) => colors[Math.round(i / neckSteps)]);
  if (mallard && neckSteps === 2) {
    const lower = smoothNeck[1], collar = smoothNeck[2], upper = smoothNeck[3];
    const edge = (a, b, t) => a.map((value, i) => THREE.MathUtils.lerp(value, b[i], t));
    smoothNeck.splice(1, 3, edge(lower, collar, .48), edge(lower, collar, .72), collar,
      edge(collar, upper, .27), edge(collar, upper, .47));
    neckPaint.splice(1, 3, colors[0], colors[1], colors[1], colors[1], colors[2]);
  }
  animalProfile(h, smoothNeck, sides, i => neckPaint[i]);
  const [, hy, hz] = hc;
  h.ell(0, hy, hz, hr * (owl ? 1.08 : .91), hr * .92, hr * (owl ? .83 : 1.10), o.headC, { ws: 9, hs: 6 });

  const r = o.billR, bz = hz - hr * (owl ? .69 : .81);
  const dy = o.billDrop || 0, bend = y => hy - hr * .12 - y * dy;
  const shape = mallard ? [[0, .78, .48], [.37, 1.00, .46], [.79, .89, .37], [.94, .57, .27]]
    : webbed ? [[0, .91, .66], [.38, .83, .58], [.79, .54, .39]]
    : [[0, .84, .82], [.34, .62, .64]];
  const mask = kind === 'cigno' ? BLACK : o.billC;
  animalProfile(h, [...shape.map(([t, rx, ry]) => [0, bend(t), bz - o.bill * t, rx * r, ry * r]),
    [0, bend(1), bz - o.bill, 0, 0]], webbed && QL.detail ? 8 : 6,
  (i, a) => i === 0 ? mask : Math.abs(Math.sin(a)) < .2 && webbed ? o.billC.clone().multiplyScalar(.72) : o.billC);

  for (const sx of [-1, 1]) {
    if (owl) h.ell(sx * hr * .46, hy - hr * .04, hz - hr * .56,
      hr * .52, hr * .64, hr * .27, C(0xb6a185), { ws: 7, hs: 4 });
    const eyeZ = hz - hr * (owl ? .81 : .42);
    animalEye(h, sx * hr * (owl ? .48 : .79), hy + hr * (owl ? .12 : .18), eyeZ,
      o.eye || hr * .15, o.eyeC || BLACK, sx, o.hi, owl);
    if (o.hi && webbed) h.ell(sx * r * .55, bend(.35) + r * .31, bz - o.bill * .35,
      r * .12, r * .10, r * .20, BLACK, { ws: 5, hs: 3 });
  }
  if (o.extra) o.extra(h, hc, b);
  return { body: b, head: h, hp: pv, wing: w, wp: [bw * .69, slope(.42, -bl * .48), -bl * .48], o, fn: birdModel };
}

function quadModel(o) {
  const b = new MB(), h = new MB(), { w, l, bh, hr, kind } = o;
  const rabbit = kind === 'coniglio', cat = kind === 'gatto', fox = kind === 'volpe';
  const cow = kind === 'mucca', sheep = kind === 'pecora', hedgehog = kind === 'riccio';
  const crouched = rabbit || cat || hedgehog, hoofed = cow || sheep || kind === 'asino';
  const sides = o.hi ? 14 : QL.detail ? 10 : 7;
  const sample = (color, x, y, z) => typeof color === 'function' ? color(x, y, z) : color;
  const back = [[-1.07, .30, 0, 0], [-.81, .17, .66, .72], [-.48, .06, .90, .96],
    [0, 0, 1, 1], [.44, -.04, crouched ? 1.06 : .96, 1.0], [.78, -.12, .81, .76], [1.03, -.09, 0, 0]];
  if (o.hi) back.splice(4, 0, [.22, -.025, 1, 1.02]);
  const flock = sheep && QL.detail, woolLight = flock ? o.bodyC.clone().multiplyScalar(1.055) : null;
  const woolDark = flock ? o.bodyC.clone().multiplyScalar(.88) : null;
  const wave = (i, a) => Math.cos(a * (o.hi ? 5 : 3) + i * 2.15) * Math.sin(a * 2 - i * 1.65);
  animalProfile(b, back.map(([z, y, x, r]) => [0, o.h + bh * y - Math.sin(o.tilt || 0) * z * l, z * l, w * x, bh * r]),
    sides, (i, a) => flock ? o.bodyC.clone().lerp(wave(i, a) > 0 ? woolLight : woolDark, Math.abs(wave(i, a)))
      : sample(o.bodyC, Math.cos(a), Math.sin(a), back[i][0]),
    flock || hedgehog ? (i, a) => 1 + wave(i, a) * (flock ? .12 : .095) : null);

  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const x = sx * w * (sz > 0 && crouched ? .66 : .55);
    const z = sz * l * .62, r = o.legR;
    const top = o.h - bh * (crouched && sz > 0 ? .04 : .4) - Math.sin(o.tilt || 0) * z;
    const foot = o.hoof || .03, footC = o.hoofC || BLACK;
    if ((rabbit || cat) && sz > 0) {
      // Coscia larga ripiegata contro il fianco, tallone raccolto sotto la groppa.
      const tuck = rabbit ? 1 : .62;
      animalProfile(b, [[x * .67, top + r * 1.2, z, r * .83, r * 1.33],
        [x * 1.12, top * .58, z - r * .09, r * 1.58, r * 2.03],
        [x * 1.12, foot * 1.48, z + r * .45, r * 1.17, r * 1.04],
        [x, foot * .54, z - r * 1.5 * tuck, r * 1.04, r * .42],
        [x, foot * .43, z - r * 3.05 * tuck, 0, 0]], QL.detail ? 8 : 6,
      i => i < 3 ? o.legC : footC);
      continue;
    }
    const spread = sz > 0 && crouched ? 1.24 : 1.02;
    animalProfile(b, [[x * .93, top, z, r * spread, r * (crouched ? 1.5 : 1.16)],
      [x, top * .62, z + sz * r * (crouched ? .65 : .48), r * (crouched ? 1.01 : .85), r],
      [x, foot * 1.29, z + r * .1, r * .66, r * .73],
      [x, foot * .42, z - r * .41, r * .91, r * 1.18],
      [x, .005, z - r * .52, r * .74, r * .94],
      [x, .001, z - r * .52, 0, 0]], QL.detail ? 6 : 4, i => {
      if (i >= 3) return footC;
      if (i === 0 && sheep) return o.bodyC;
      return o.legC;
    });
  }
  if (fox) {
    const orange = o.neckC;
    animalProfile(b, [[0, .24, .18, .037, .041], [.013, .27, .31, .055, .059],
      [.028, .25, .45, .061, .057], [.044, .205, .56, .042, .04],
      [.052, .18, .614, .023, .023], [.05, .17, .65, 0, 0]], 8, i => i > 2 ? WHITE : orange);
  } else if (cat) {
    animalProfile(b, [[0, .10, .09, .020, .019], [.038, .071, .17, .018, .017],
      [.104, .041, .194, .016, .015], [.159, .042, .163, .013, .013],
      [.18, .055, .115, .012, .011], [.168, .063, .083, 0, 0]], 6, () => o.earC);
  } else if (o.tail) o.tail(b);

  const pv = [0, o.h + bh * .22, -l * .60], hz = -(l + o.hz), hy = o.hy;
  const mr = o.muzL || 1, broad = cow ? .94 : sheep ? .68 : cat ? .64 : .57;
  const skull = [
    [0, pv[1], pv[2], o.neckR * 1.12, o.neckR],
    [0, THREE.MathUtils.lerp(pv[1], hy, .60) - hr * .10, THREE.MathUtils.lerp(pv[2], hz, .56), o.neckR * .82, o.neckR * .83],
    [0, hy - hr * .07, hz + hr * .38, hr * (cat ? .99 : .9), hr * .92],
    [0, hy, hz - hr * .15, hr, hr * .91],
    [0, hy - hr * .18, hz - hr * .79, hr * (fox ? .50 : .71), hr * .58],
    [0, hy - hr * .31, hz - hr * (mr + .38), hr * (fox ? .32 : broad), hr * .40],
    [0, hy - hr * .30, hz - hr * (mr + .73), hr * (cow ? .60 : fox ? .19 : .39), hr * .26],
    [0, hy - hr * .30, hz - hr * (mr + .85), 0, 0]
  ];
  animalProfile(h, skull, sides, (i, a, p) => {
    if (i < 2) return o.neckC;
    if (i >= 6 && !cow && Math.sin(a) < .28) return o.noseC || BLACK;
    if (i >= 5 || (i === 4 && Math.sin(a) > .4)) return o.muzC;
    return sample(o.headC, (p.x / hr), (p.y - hy) / hr, (p.z - hz) / hr);
  });
  for (const sx of [-1, 1]) {
    const ex = sx * hr * (cat ? .65 : .91), ez = hz - hr * (cat ? .78 : .37);
    animalEye(h, ex, hy + hr * .23, ez, hr * (cat ? .19 : .139), cat ? C(0x97ac55) : BLACK, sx, o.hi, cat);
    const tilt = o.earTilt || .5, reach = o.earH * (rabbit ? 1.76 : 2);
    const x = sx * hr * (hoofed ? .75 : rabbit ? .40 : .60);
    const y = hy + hr * (hoofed ? .50 : .67), z = hz + hr * .31;
    const ear = (t, r, d) => [x + sx * Math.sin(tilt) * reach * t, y + Math.cos(tilt) * reach * t,
      z + reach * (hoofed ? .08 : .17) * t, o.earW * r, (o.earT || .012) * d];
    const inner = C(hoofed ? 0x9c8070 : 0xc39088);
    const outline = [ear(0, .57, .65), ear(.27, 1, .83), ear(rabbit ? .72 : .59, rabbit ? .80 : .52, .55)];
    if (rabbit) outline.push(ear(.91, .51, .37));
    outline.push(ear(1, 0, 0));
    animalProfile(h, outline, QL.detail ? 8 : 6,
    (i, a) => i > 0 && i < 3 && Math.sin(a) > .44 ? inner : o.earC);
    if (o.hi && cow) {
      animalProfile(h, [[sx * hr * .54, hy + hr * .64, hz + hr * .30, hr * .155, hr * .16],
        [sx * hr * .96, hy + hr * 1.02, hz + hr * .30, hr * .10, hr * .10],
        [sx * hr * 1.17, hy + hr * 1.40, hz + hr * .16, 0, 0]], 6, () => C(0xd8d0bc));
    }
    if (cow || (sheep && o.hi)) {
      h.ell(sx * hr * (cow ? .41 : .20), hy - hr * .18, hz - hr * (mr + .68),
        hr * .12, hr * .085, hr * .068, o.noseC || BLACK, { ws: 5, hs: 3 });
    }
  }
  if (o.extra) o.extra(h, [0, hy, hz], b);
  return { body: b, head: h, hp: pv, wing: null, o, fn: quadModel };
}

      out.legs.forEach((L, i) => {

        L.g.position.y += .056 * lift;
        L.low.rotation.x -= .38 * lift;

      const upScale = Math.cos(pitch) * Math.cos(bank) * sc;

          // arretrando a zampa aperta, recupero più lungo e raccolto per ridurre la resistenza.
